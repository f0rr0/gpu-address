[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "gpu-postal"
version = "0.1.0"
description = "Small postal-address models for browser inference"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "brotli==1.2.0",
  "numpy==2.4.6",
  "pyarrow==25.0.1",
  "rdflib==7.6.0",
  "torch==2.14.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "ty==0.0.80"]

[project.scripts]
gpu-postal = "gpu_postal.cli:main"

[tool.uv.build-backend]
module-root = "packages/training/src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
