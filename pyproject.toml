[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "gpu-address"
version = "0.1.0"
description = "Small postal-address models for browser inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.14.0", "numpy==2.4.6"]

[project.optional-dependencies]
data = ["rdflib==7.6.0", "pyarrow==25.0.1"]
export = ["onnx==1.22.0", "onnxruntime==1.30.0", "brotli==1.2.0"]

[dependency-groups]
dev = ["ruff==0.16.7", "ty==0.0.80", "pytest==9.1.1"]

[project.scripts]
gpu-address = "gpu_address.cli:main"

[tool.uv.build-backend]
module-root = "packages/training/src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
